<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LoanIQ – AI Loan Eligibility Predictor</title>
  <link rel="stylesheet" href="style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
</head>
<body>
  <div class="bg-animated"></div>

  <header>
    <div class="logo">🎯 LoanIQ</div>
    <p class="tagline">AI-Powered Loan Eligibility Predictor</p>
  </header>

  <main>
    <div class="card form-card">
      <h2>Check Your Eligibility</h2>
      <p class="sub">Fill in your details for an instant AI-powered assessment</p>

      <div class="form-grid">
        <div class="field">
          <label>Gender</label>
          <select id="Gender">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </div>

        <div class="field">
          <label>Marital Status</label>
          <select id="Married">
            <option value="Yes">Married</option>
            <option value="No">Single</option>
          </select>
        </div>

        <div class="field">
          <label>Dependents</label>
          <select id="Dependents">
            <option value="0">0</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3+">3+</option>
          </select>
        </div>

        <div class="field">
          <label>Education</label>
          <select id="Education">
            <option value="Graduate">Graduate</option>
            <option value="Not Graduate">Not Graduate</option>
          </select>
        </div>

        <div class="field">
          <label>Self Employed</label>
          <select id="Self_Employed">
            <option value="No">No</option>
            <option value="Yes">Yes</option>
          </select>
        </div>

        <div class="field">
          <label>Credit History</label>
          <select id="Credit_History">
            <option value="1">Good (1)</option>
            <option value="0">Bad (0)</option>
          </select>
        </div>

        <div class="field">
          <label>Property Area</label>
          <select id="Property_Area">
            <option value="Urban">Urban</option>
            <option value="Semiurban">Semiurban</option>
            <option value="Rural">Rural</option>
          </select>
        </div>

        <div class="field">
          <label>Loan Term (months)</label>
          <select id="Loan_Amount_Term">
            <option value="360">360</option>
            <option value="180">180</option>
            <option value="120">120</option>
            <option value="60">60</option>
            <option value="36">36</option>
            <option value="12">12</option>
          </select>
        </div>

        <div class="field full">
          <label>Applicant Income (₹/month)</label>
          <input type="number" id="ApplicantIncome" placeholder="e.g. 50000" min="0"/>
        </div>

        <div class="field full">
          <label>Co-applicant Income (₹/month)</label>
          <input type="number" id="CoapplicantIncome" placeholder="e.g. 20000" min="0" value="0"/>
        </div>

        <div class="field full">
          <label>Loan Amount (₹)</label>
          <input type="number" id="LoanAmount" placeholder="e.g. 150000" min="0"/>
        </div>
      </div>

      <button class="btn-predict" id="predictBtn" onclick="predict()">
        <span id="btnText">🔍 Check Eligibility</span>
        <span id="btnLoader" class="hidden">⏳ Analyzing...</span>
      </button>
    </div>

    <!-- Result Card -->
    <div class="card result-card hidden" id="resultCard">
      <div id="resultIcon" class="result-icon"></div>
      <h2 id="resultTitle"></h2>
      <p id="resultConfidence" class="confidence-text"></p>

      <div class="prob-bars">
        <div class="prob-item">
          <span>Approved</span>
          <div class="bar-bg"><div class="bar-fill green" id="barApproved"></div></div>
          <span id="pctApproved"></span>
        </div>
        <div class="prob-item">
          <span>Rejected</span>
          <div class="bar-bg"><div class="bar-fill red" id="barRejected"></div></div>
          <span id="pctRejected"></span>
        </div>
      </div>

      <div class="summary" id="summary"></div>

      <button class="btn-download" onclick="downloadReport()">📄 Download Report</button>
      <button class="btn-reset" onclick="resetForm()">🔄 Try Again</button>
    </div>

    <div class="error-box hidden" id="errorBox">
      ⚠️ <span id="errorMsg"></span>
    </div>
  </main>

  <footer>
    <p>Built with ❤️ using Flask · Scikit-learn · Vanilla JS &nbsp;|&nbsp; LoanIQ © 2025</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
